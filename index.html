<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background: #333;
            color: #fff;
            padding: 2rem 0;
        }
        section {
            padding: 2rem;

            margin: auto;

            margin-top: 20px;
            border-radius: 8px;

        .btn {
            display: inline-block;
            background: #0078d4;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }

<body>

    <header>
        <h1>مرحباً بكم في مشروعي الأول</h1>
        <p>مستضاف حالياً على Azure</p>

    <section>
        <h2>من أنا؟</h2>
        <p>أنا مطور أتعلم كيفية استخدام GitHub و Azure لتطوير وتدريب تطبيقات الويب.</p>
        
        <h2>أهدافي</h2>
        <ul style="text-align: right; display: inline-block;">
            <li>تعلم أساسيات Git</li>
            <li>نشر التطبيقات (Deployment) على Azure</li>
            <li>بناء واجهات مستخدم احترافية</li>
        </ul>
        <br>
        <a href="#" class="btn">تواصل معي</a>

</html>
